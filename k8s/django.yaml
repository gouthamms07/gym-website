apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: expose-gym
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: django
          image: 188244334939.dkr.ecr.ap-south-1.amazonaws.com/expose-gym:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-secret
                  key: SECRET_KEY
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secret
                  key: DATABASE_PASSWORD
            - name: DATABASE_NAME
              value: expose_gym
            - name: DATABASE_USER
              value: expose_gym
            - name: DATABASE_HOST
              value: postgres
            - name: DATABASE_PORT
              value: "5432"
            - name: DEBUG
              value: "False"
            - name: ALLOWED_HOSTS
              value: "localhost,127.0.0.1,43.205.198.230,13.201.25.201"
            - name: CSRF_TRUSTED_ORIGINS
              value: "http://43.205.198.230,http://13.201.25.201"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: django
  namespace: expose-gym
spec:
  type: ClusterIP
  selector:
    app: django
  ports:
    - port: 8000
      targetPort: 8000
