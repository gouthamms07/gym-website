name: Expose Gym Ansible Automation

on:
  workflow_dispatch:
    inputs:
      run_playbook:
        description: "Run the Ansible configuration playbook"
        required: true
        type: boolean
        default: false

env:
  AWS_REGION: ap-south-1

permissions:
  contents: read
  id-token: write

concurrency:
  group: expose-gym-ansible
  cancel-in-progress: false

jobs:
  ansible:
    name: Test SSM and run Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::188244334939:role/expose-gym-ansible-github-actions-role
          aws-region: ap-south-1


      - name: Discover EC2 instances and generate Ansible inventory
        shell: bash
        run: |
          set -euo pipefail

          CONTROL_PLANE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:Name,Values=expose-gym-control-plane" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          WORKER_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:Name,Values=expose-gym-worker-1" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [ "$(echo "$CONTROL_PLANE_ID" | wc -w | tr -d ' ')" -ne 1 ]; then
            echo "Error: Expected exactly one running control-plane instance."
            exit 1
          fi

          if [ "$(echo "$WORKER_ID" | wc -w | tr -d ' ')" -ne 1 ]; then
            echo "Error: Expected exactly one running worker instance."
            exit 1
          fi

          mkdir -p ansible/inventory

          cat > ansible/inventory/ssm.yml <<EOF
          ---
          all:
            children:
              k8s_cluster:
                children:
                  control_plane:
                    hosts:
                      ${CONTROL_PLANE_ID}:
                  workers:
                    hosts:
                      ${WORKER_ID}:
                vars:
                  ansible_connection: amazon.aws.aws_ssm
                  ansible_aws_ssm_region: ${AWS_REGION}
                  ansible_aws_ssm_bucket_name: expose-gym-ansible-transfer-188244334939
                  ansible_become: true
          EOF

          echo "Discovered control plane: $CONTROL_PLANE_ID"
          echo "Discovered worker: $WORKER_ID"
          cat ansible/inventory/ssm.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core boto3 botocore

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml


      - name: Validate Ansible inventory
        run: |
          ansible-inventory -i ansible/inventory/ssm.yml --list
          ansible-inventory -i ansible/inventory/ssm.yml --graph

      - name: Install AWS Session Manager plugin
        run: |
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version


      - name: Test SSM connectivity
        run: |
          ansible -i ansible/inventory/ssm.yml k8s_cluster -m ping -vv

      - name: Run Ansible playbook
        if: ${{ inputs.run_playbook }}
        run: |
          ansible-playbook -i ansible/inventory/ssm.yml ansible/site.yml --limit k8s_cluster
