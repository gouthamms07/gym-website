name: Terraform Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: expose-gym-terraform
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Validate and Plan Infrastructure
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_allowed_ssh_cidr: ${{ vars.ALLOWED_SSH_CIDR }}
      TF_VAR_public_key_content: ${{ secrets.TF_PUBLIC_KEY }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::188244334939:role/expose-gym-terraform-role
          aws-region: ap-south-1
          role-session-name: GitHubActionsTerraformPlan

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Verify SSH public key secret
        shell: bash
        run: |
          if [ -z "$TF_VAR_public_key_content" ]; then
            echo "ERROR: TF_PUBLIC_KEY is empty or unavailable."
            exit 1
          fi
          if [[ "$TF_VAR_public_key_content" != ssh-ed25519 * ]]; then
            echo "ERROR: The SSH public key format is unexpected."
            exit 1
          fi
          echo "SSH public key secret is present and has the expected format."

      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=60s
