plugin: amazon.aws.aws_ec2

regions:
  - ap-south-1

filters:
  tag:Project: expose-gym
  instance-state-name: running

hostnames:
  - instance-id

groups:
  k8s_cluster: "ec2_tags.Project == 'expose-gym'"
  control_plane: "ec2_tags.Role == 'control-plane'"
  workers: "ec2_tags.Role == 'worker'"

compose:
  ansible_host: public_ip_address
