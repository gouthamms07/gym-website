---
- name: Install Kubernetes components
  hosts: k8s_cluster
  become: true
  gather_facts: true

  vars:
    kubernetes_minor_version: "v1.34"

  tasks:
    - name: Create directory for Kubernetes repository key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download Kubernetes repository signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        owner: root
        group: root
        mode: '0644'

    - name: Add Kubernetes apt repository
      ansible.builtin.deb822_repository:
        name: kubernetes
        types:
          - deb
        uris:
          - "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/"
        suites:
          - /
        signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        state: present
        enabled: true

    - name: Install Kubernetes packages
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes package versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet service
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
