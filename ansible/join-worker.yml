---
- name: Generate a fresh Kubernetes join command
  hosts: control_plane
  become: true
  gather_facts: false

  tasks:

    - name: Generate a fresh worker join command
      ansible.builtin.command:
        argv:
          - kubeadm
          - token
          - create
          - --print-join-command
      register: join_command
      changed_when: false
      no_log: true

- name: Join worker nodes to Kubernetes
  hosts: workers
  become: true
  gather_facts: false

  tasks:
    - name: Join worker to the cluster
      ansible.builtin.command: "{{ hostvars[groups['control_plane'][0]].join_command.stdout }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
      register: worker_join
      no_log: true

    - name: Confirm worker joined
      ansible.builtin.debug:
        msg: "Worker join command completed successfully."
      when: worker_join.rc == 0
